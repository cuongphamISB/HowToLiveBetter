<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Ảnh chia sẻ sách</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;font-family:Georgia,"Times New Roman",serif;background:#fff;color:#1b1b1f;overflow:hidden}
.bg{position:absolute;inset:0;background:radial-gradient(700px 420px at 90% 0%,#3451b21c,transparent 70%),radial-gradient(560px 380px at 0% 100%,#18794e15,transparent 70%)}
.bar{height:8px;background:linear-gradient(90deg,#3451b2,#5672cd 50%,#18794e)}
.in{position:relative;padding:56px 70px;height:622px;display:flex;flex-direction:column}
.brand{font:600 23px/1.4 "Segoe UI",sans-serif;color:#3451b2}
h1{font-size:73px;line-height:1.1;letter-spacing:-.025em;margin-top:34px}
h1 em{font-style:normal;color:#3451b2}
p{font:25px/1.5 "Segoe UI",sans-serif;color:#535359;margin-top:26px;max-width:1000px}
.chips{display:flex;gap:14px;margin-top:auto;flex-wrap:wrap;font:20px/1.3 "Segoe UI",sans-serif}
.c{padding:10px 16px;background:#f6f6f7;border-radius:999px;color:#4c4c55}.c:first-child{background:#3451b219;color:#3451b2}.c:nth-child(2){background:#18794e18;color:#18794e}
</style></head><body><div class="bg"></div><div class="bar"></div><div class="in">
<div class="brand">HƯỚNG DẪN SỐNG HIỆU QUẢ</div>
<h1>Giữ sức khỏe, tiền bạc,<br><em>thời gian và tự do.</em></h1>
<p>Từ phòng bệnh và sơ cứu đến việc làm, gia đình và pháp luật.<br>Mỗi lựa chọn đều ghi rõ chi phí, lợi ích và nguồn kiểm chứng.</p>
<div class="chips"><div class="c"><b>649</b> gợi ý</div><div class="c">Bằng chứng A: <b>428</b></div><div class="c"><b>1534</b> nguồn</div></div>
</div></body></html>
